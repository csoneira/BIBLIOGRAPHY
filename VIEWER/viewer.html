<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Bibliography</title>
    <style>
      :root {
        --bg: #f8f4ef;
        --bg-accent: #d9d0c7;
        --ink: #1f2428;
        --muted: #5f6a6f;
        --accent: #1e4f7a;
        --card: #ffffffcc;
        --shadow: 0 12px 30px rgba(31, 36, 40, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #fff6e8, var(--bg) 40%)
          fixed;
        min-height: 100vh;
      }

      header {
        padding: 32px 10vw 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(28px, 3vw, 40px);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }

      .panel {
        margin: 0 10vw 24px;
        padding: 20px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .dashboard {
        margin: 0 10vw 24px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
      }

      .dashboard-item {
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .dashboard-item strong {
        display: block;
        color: var(--accent);
        font-size: 22px;
      }

      .dashboard-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .result-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
        gap: 8px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #ddd5cd;
      }

      .result-summary-item {
        padding: 9px 12px;
        border-radius: 10px;
        background: #f3f5f6;
        color: var(--muted);
        font-size: 13px;
      }

      .result-summary-item strong {
        display: block;
        color: var(--accent);
        font-size: 19px;
      }

      .filters {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .saved-filter-bar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(180px, 1fr);
        align-items: end;
        gap: 10px;
        margin-bottom: 16px;
      }

      .saved-filter-bar button {
        margin-bottom: 1px;
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #d6d6d6;
        font-family: inherit;
        font-size: 15px;
        background: #fff;
      }

      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #d6d6d6;
        font-family: inherit;
        font-size: 15px;
        background: #fff;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .entry-panel {
        margin: 0 10vw 24px;
        padding: 20px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .entry-panel summary {
        color: var(--accent);
        cursor: pointer;
        font-size: 17px;
        font-weight: 600;
      }

      .entry-form {
        margin-top: 16px;
      }

      .entry-form textarea {
        width: 100%;
        min-height: 80px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #d6d6d6;
        font-family: inherit;
        font-size: 14px;
      }

      .entry-checks {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .entry-checks label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
      }

      .entry-checks input {
        width: auto;
      }

      .type-options {
        display: flex;
        align-items: center;
        gap: 6px 12px;
        flex-wrap: wrap;
        min-height: 42px;
        max-height: 110px;
        overflow-y: auto;
        padding: 8px 10px;
        border: 1px solid #d6d6d6;
        border-radius: 10px;
        background: #fff;
      }

      .type-options label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        color: var(--ink);
        white-space: nowrap;
      }

      .type-options input {
        width: auto;
      }

      .type-filter {
        grid-column: 1 / -1;
      }

      .status-options {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid #d6d6d6;
        border-radius: 10px;
        background: #fff;
      }

      .status-options label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        color: var(--ink);
        white-space: nowrap;
      }

      .status-options input {
        width: auto;
      }

      .action-check {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 8px 10px;
        border-radius: 999px;
        background: #f1f2f3;
        color: var(--ink);
      }

      .action-check input {
        width: auto;
      }

      .entry-status {
        align-self: center;
        color: var(--muted);
        font-size: 13px;
      }

      button {
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-family: inherit;
        cursor: pointer;
        font-size: 14px;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
      }

      button.secondary {
        background: #e2e6ea;
        color: var(--ink);
      }

      button.danger {
        background: #f9e4e1;
        color: #8a2417;
        border: 1px solid #e8b8b1;
      }

      button.compact {
        padding: 5px 10px;
        font-size: 12px;
      }

      .nav-link {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background: #e2e6ea;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
      }

      .entry-edit-only[hidden] {
        display: none;
      }

      .type-manager-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .wide-field {
        grid-column: 1 / -1;
      }

      .inline-tool {
        display: flex;
        gap: 8px;
      }

      .inline-tool input {
        flex: 1;
      }

      .star {
        background: transparent;
        color: var(--accent);
        border: 1px solid #d6d6d6;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 16px;
        line-height: 1;
      }

      .unread {
        background: transparent;
        color: #7b1f0f;
        border: 1px solid #d6d6d6;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }

      .location-badge {
        border: 1px solid #d6d6d6;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
      }

      .location-badge.local {
        background: #e8f5e9;
        color: #22652d;
      }

      .location-badge.remote {
        background: #f1f2f3;
        color: var(--muted);
      }

      .location-badge.not-added {
        background: #fff3cd;
        color: #725500;
      }

      .results {
        margin: 0 10vw 40px;
        display: grid;
        gap: 16px;
      }

      .card {
        padding: 16px 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: var(--shadow);
        animation: fadeIn 0.3s ease both;
      }

      .card h3 {
        margin: 0 0 6px;
        font-size: 18px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
      }

      .code {
        font-family: "Courier New", Courier, monospace;
        color: var(--accent);
        font-size: 13px;
      }

      .toggle-abstract,
      .toggle-notes {
        margin-top: 10px;
        background: #eef3f7;
        color: var(--accent);
        border: 1px solid #d6d6d6;
      }

      .toggle-notes {
        margin-left: 6px;
      }

      .toggle-abstract:disabled {
        color: var(--muted);
        background: #f2f2f2;
        cursor: default;
      }

      .abstract {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e6ea;
        color: #2f3941;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .notes-section {
        margin-top: 12px;
      }

      .notes-label {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .notes-editor {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #d6d6d6;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.4;
        background: #fff;
      }

      .notes-controls {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notes-save {
        background: #eef3f7;
        color: var(--accent);
        border: 1px solid #d6d6d6;
        border-radius: 999px;
        padding: 6px 12px;
      }

      .notes-save:disabled {
        opacity: 0.65;
        cursor: default;
      }

      .notes-status {
        font-size: 12px;
        color: var(--muted);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 720px) {
        header,
        .dashboard,
        .panel,
        .entry-panel,
        .results {
          margin: 0 6vw 24px;
        }
        .saved-filter-bar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bibliography</h1>
      <p>Search, filter, and annotate metadata, then open local PDFs directly.</p>
      <div class="actions">
        <a class="nav-link" href="manage.html">Options</a>
      </div>
    </header>

    <section class="dashboard" aria-label="Library summary">
      <div class="dashboard-item"><strong id="countTotal">–</strong>Total entries</div>
      <div class="dashboard-item"><strong id="countLocal">–</strong>Local</div>
      <div class="dashboard-item"><strong id="countRemote">–</strong>Remote</div>
      <div class="dashboard-item"><strong id="countNotAdded">–</strong>Not added</div>
      <div class="dashboard-item"><strong id="countMultiple">–</strong>Multiple computers</div>
      <div class="dashboard-item dashboard-actions">
        <button class="secondary compact" id="undoBtn" type="button">Undo last change</button>
        <button class="secondary compact" id="auditBtn" type="button">Audit PDFs</button>
      </div>
    </section>

    <section class="panel">
      <div class="saved-filter-bar">
        <div>
          <label for="savedList">Saved filter</label>
          <select id="savedList">
            <option value="">Select a saved filter</option>
          </select>
        </div>
        <button class="secondary" id="loadListBtn" type="button">Load filter</button>
        <span class="entry-status" id="savedFilterStatus"></span>
      </div>
      <div class="filters">
        <div>
          <label for="fromDate">From date</label>
          <input id="fromDate" type="date" />
        </div>
        <div>
          <label for="toDate">To date</label>
          <input id="toDate" type="date" />
        </div>
        <div>
          <label for="titleFilter">Title contains</label>
          <input id="titleFilter" type="text" placeholder="muon, detector" />
        </div>
        <div>
          <label>Status</label>
          <div class="status-options">
            <label><input id="starOnly" type="checkbox" /> Starred</label>
            <label><input id="unreadOnly" type="checkbox" /> Unread</label>
          </div>
        </div>
        <div>
          <label for="locationFilter">PDF location</label>
          <select id="locationFilter">
            <option value="">All PDFs</option>
            <option value="local">Local on this computer</option>
            <option value="remote">Remote on another computer</option>
            <option value="not_added">PDF not added</option>
          </select>
        </div>
        <div>
          <label for="journal">Journal contains</label>
          <input id="journal" type="text" placeholder="Nature, NIM A" />
        </div>
        <div>
          <label for="keyword">Keywords contain</label>
          <input id="keyword" type="text" placeholder="muon, detector" />
        </div>
        <div>
          <label for="myKeyword">My keywords contain</label>
          <input id="myKeyword" type="text" placeholder="project-x" />
        </div>
        <div>
          <label for="abstractFilter">Abstract contains</label>
          <input id="abstractFilter" type="text" placeholder="calibration, detector response" />
        </div>
        <div>
          <label for="addedFrom">Added from</label>
          <input id="addedFrom" type="date" />
        </div>
        <div>
          <label for="addedTo">Added to</label>
          <input id="addedTo" type="date" />
        </div>
        <div>
          <label for="readFrom">Read from</label>
          <input id="readFrom" type="date" />
        </div>
        <div>
          <label for="readTo">Read to</label>
          <input id="readTo" type="date" />
        </div>
        <div>
          <label for="addedSort">Sort order</label>
          <select id="addedSort">
            <option value="">No sort</option>
            <option value="random">Random order</option>
            <option value="added_desc">Added date: newest first</option>
            <option value="added_asc">Added date: oldest first</option>
            <option value="publication_desc">Publication date: newest first</option>
            <option value="publication_asc">Publication date: oldest first</option>
          </select>
        </div>
        <div class="type-filter">
          <label>Types</label>
          <div class="type-options" id="typeFilterOptions" aria-label="Filter by document types"></div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="applyBtn">Apply filters</button>
        <button class="secondary" id="resetBtn">Reset</button>
        <button class="secondary" id="surpriseBtn">Surprise me</button>
      </div>
      <div class="result-summary" aria-label="Current result summary">
        <div class="result-summary-item"><strong id="resultCountTotal">–</strong>Results</div>
        <div class="result-summary-item"><strong id="resultCountLocal">–</strong>Local</div>
        <div class="result-summary-item"><strong id="resultCountRemote">–</strong>Remote</div>
        <div class="result-summary-item"><strong id="resultCountNotAdded">–</strong>Not added</div>
        <div class="result-summary-item"><strong id="resultCountStarred">–</strong>Starred</div>
        <div class="result-summary-item"><strong id="resultCountUnread">–</strong>Unread</div>
      </div>
      <div class="actions" aria-label="Actions for current results">
        <button class="secondary" id="saveViewBtn">Save filter</button>
        <select id="citationFormat" aria-label="Citation format" style="width: auto">
          <option value="formatted">Formatted citation</option>
          <option value="bibtex">BibTeX</option>
          <option value="ris">RIS</option>
        </select>
        <button class="secondary" id="downloadCitationsBtn">Download citations</button>
      </div>
    </section>

    <input id="pdfUpload" type="file" accept="application/pdf,.pdf" hidden />

    <section class="results" id="results"></section>

    <script>
      (function loadFreshViewerScript() {
        const script = document.createElement("script");
        script.src = `viewer.js?t=${Date.now()}`;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
